name: CI

on:
  push:
  pull_request:

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build deterministic wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel for source checkout test run
        run: python -m pip install --no-index --no-deps dist/pointer_presence_gate-0.1.0-py3-none-any.whl
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Fresh install and installed CLI acceptance
        run: python acceptance.py dist/pointer_presence_gate-0.1.0-py3-none-any.whl
